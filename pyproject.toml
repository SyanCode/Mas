[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.1.0b1"
description = "Self-hosted server manager that discovers and adopts what is already running on your Debian + nginx box."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "argon2-cffi>=23",
    "pyotp>=2.9",
    "segno>=1.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mas = "mas.cli:app"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
